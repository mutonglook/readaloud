name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest 已预装 Android SDK，直接用它的 sdkmanager 补齐需要的包。
      # 不用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除该包，导致 "Failed to find package 'tools'"。
      - name: Install Android SDK packages
        run: |
          set -x
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SM" ] || SM=$(command -v sdkmanager)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36" || true
          "$SM" --install "build-tools;36.0.0" || echo "build-tools 交给 AGP 自动下载"
          ls "$ANDROID_HOME/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android project
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          ls android/capacitor-cordova-android-plugins

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          # 固定文件名：这样 releases/latest/download/tingshuge.apk 永远指向最新版
          cp android/app/build/outputs/apk/debug/app-debug.apk out/tingshuge.apk

      - name: Verify APK
        run: |
          APK=$(ls out/*.apk | head -1)
          ls -lh "$APK"
          echo "--- 关键内容 ---"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|assets/public/index.html|classes[0-9]*\.dex" || true
          echo "--- 条目总数 ---"
          unzip -l "$APK" | tail -1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tingshuge-debug-apk
          path: out/*.apk
          retention-days: 90

      # ---- 正式签名包：先在仓库 Settings → Secrets 里配置 KEYSTORE_BASE64 /
      # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四项后自动启用 ----
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: tingshuge-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      # ---- 推 v* 标签时自动发 Release，APK 有直链、免登录下载 ----
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 听书阁 ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 安装说明
            1. 下载下方 `tingshuge-*.apk`
            2. 手机点开安装，如提示"未知来源"，在系统设置里允许本次安装
            3. 首次打开可在空书架点「手边没书？先读个示例」试听朗读效果

            这是 debug 签名包，可直接安装；如需上架应用商店，请配置正式签名 Secrets。
